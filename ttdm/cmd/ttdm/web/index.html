<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ttdm 私信控制台</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a5; --accent: #4f8cff; --ok: #34c98b; --warn: #e5b83c; --err: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; font-family: Consolas, monospace; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 400; }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.danger { background: transparent; border: 1px solid var(--border); color: var(--err); padding: 4px 10px; font-size: 12px; }
  button.danger:hover { border-color: var(--err); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .switch-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .switch-group button { background: transparent; border: 0; border-radius: 0; padding: 9px 20px; color: var(--muted); font-weight: 500; }
  .switch-group button.active { background: var(--accent); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ads { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge.local { background: rgba(52,201,139,.15); color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .st-0 { color: var(--muted); } .st-1 { color: var(--accent); } .st-2 { color: var(--ok); }
  .st-3 { color: var(--warn); } .st-4 { color: var(--err); }
  .err-text { color: var(--err); font-size: 12px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px; display: none; z-index: 9; max-width: 420px; }
  .toast.show { display: block; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>ttdm 私信控制台</h1>
<div class="sub">TikTok 私信触达 · 本地服务 · 数据存储于本机 SQLite</div>

<div class="card">
  <h2>浏览器环境
    <span id="modeBadge" class="badge ads">指纹浏览器</span>
  </h2>
  <div class="row">
    <div class="switch-group" id="modeSwitch">
      <button id="modeAds" class="active">指纹浏览器 (Ads)</button>
      <button id="modeLocal">本地浏览器</button>
    </div>
    <div id="adsField" style="flex:1;min-width:260px">
      <label>AdsPower 本地 API Key</label>
      <input id="adsKey" type="password" placeholder="AdsPower API Key（指纹模式需要）">
    </div>
    <div id="localField" style="flex:1;min-width:160px;display:none">
      <label>本地浏览器 CDP 调试端口</label>
      <input id="localPort" type="number" placeholder="9222" min="1" max="65535">
    </div>
    <button id="saveSettings">保存设置</button>
  </div>
  <div class="hint" id="modeHint">指纹模式：任务走账号绑定的 AdsPower 浏览器配置（需 API Key）。</div>
</div>

<div class="card">
  <h2>创建私信任务</h2>
  <div class="grid">
    <div>
      <label>发送账号（可多选）</label>
      <select id="senders" multiple size="4"></select>
    </div>
    <div>
      <label>接收者 uid（每行一个，或逗号分隔）</label>
      <textarea id="receivers" placeholder="1234567890&#10;0987654321"></textarea>
    </div>
    <div>
      <label>话术文本</label>
      <input id="text" placeholder="Hi, check this out!">
      <label style="margin-top:10px">通道</label>
      <select id="channel">
        <option value="auto">auto（推荐，Web 优先失败降级浏览器）</option>
        <option value="web">web（HTTP 直连）</option>
        <option value="browser">browser（浏览器模拟）</option>
      </select>
    </div>
    <div>
      <label>发送间隔下限 (s) <span class="muted">≥30 规避风控</span></label>
      <input id="interval" type="number" value="30" min="1">
      <label style="margin-top:10px">随机抖动上限 (s)</label>
      <input id="jitter" type="number" value="10" min="0" max="60">
      <label style="margin-top:10px">每日发送上限（0=不限）</label>
      <input id="dailyMax" type="number" value="0" min="0">
      <label style="margin-top:10px">连续失败退出阈值</label>
      <input id="maxFail" type="number" value="5" min="1">
    </div>
  </div>
  <div class="row" style="margin-top:14px">
    <button id="createTask">创建任务</button>
    <span id="createHint" class="muted">风控参数与当前浏览器环境会自动应用到任务</span>
  </div>
</div>

<div class="card">
  <h2>任务列表 <span class="muted" style="font-weight:400">（3s 自动刷新）</span></h2>
  <table>
    <thead><tr><th>ID</th><th>状态</th><th>通道</th><th>总数</th><th>成功</th><th>失败</th><th>错误</th><th>创建时间</th><th></th></tr></thead>
    <tbody id="taskBody"><tr><td colspan="9" class="muted">加载中...</td></tr></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let mode = 'ads';

function toast(msg, ms = 3000) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

// ---------- settings ----------
function renderMode() {
  $('modeAds').classList.toggle('active', mode === 'ads');
  $('modeLocal').classList.toggle('active', mode === 'local');
  $('adsField').style.display = mode === 'ads' ? '' : 'none';
  $('localField').style.display = mode === 'local' ? '' : 'none';
  const b = $('modeBadge');
  b.textContent = mode === 'ads' ? '指纹浏览器' : '本地浏览器';
  b.className = 'badge ' + mode;
  $('modeHint').textContent = mode === 'ads'
    ? '指纹模式：任务走账号绑定的 AdsPower 浏览器配置（需 API Key）。'
    : '本地模式：browser/auto 任务经 local:' + ($('localPort').value || '9222') + ' 直连本地 Chrome/Edge，无需 API Key。';
}

async function loadSettings() {
  try {
    const s = await api('/api/settings');
    mode = s.browser_mode === 'local' ? 'local' : 'ads';
    $('localPort').value = s.local_port || '9222';
    $('adsKey').value = s.ads_api_key || '';
    renderMode();
  } catch (e) { toast('读取设置失败: ' + e.message); }
}

async function saveSettings() {
  try {
    const body = { browser_mode: mode, local_port: $('localPort').value.trim(), ads_api_key: $('adsKey').value.trim() };
    if (mode === 'local' && !body.local_port) { toast('本地模式需要填写调试端口'); return; }
    await api('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    toast('设置已保存，新任务将使用 ' + (mode === 'ads' ? '指纹浏览器' : '本地浏览器'));
    renderMode();
  } catch (e) { toast('保存失败: ' + e.message); }
}

$('modeAds').onclick = () => { mode = 'ads'; renderMode(); };
$('modeLocal').onclick = () => { mode = 'local'; renderMode(); };
$('saveSettings').onclick = saveSettings;
$('localPort').oninput = renderMode;

// ---------- accounts ----------
async function loadAccounts() {
  try {
    const list = await api('/api/accounts');
    const sel = $('senders');
    sel.innerHTML = '';
    if (!list.length) {
      sel.innerHTML = '<option disabled>无账号，请先用 CLI: ttdm account import</option>';
      return;
    }
    for (const a of list) {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = '#' + a.id + ' uid=' + a.uid + (a.nickname ? ' (' + a.nickname + ')' : '') + (a.ads_profile_id ? ' [env:' + a.ads_profile_id + ']' : '');
      sel.appendChild(opt);
    }
  } catch (e) { toast('加载账号失败: ' + e.message); }
}

// ---------- tasks ----------
async function createTask() {
  const senders = [...$('senders').selectedOptions].map(o => Number(o.value));
  const recvText = $('receivers').value.trim();
  const receivers = recvText.split(/[\s,]+/).map(s => Number(s)).filter(n => Number.isFinite(n) && n > 0);
  if (!senders.length) { toast('请选择发送账号'); return; }
  if (!receivers.length) { toast('请填写接收者 uid'); return; }
  if (!$('text').value.trim()) { toast('请填写话术文本'); return; }
  const body = {
    senders, receivers, text: $('text').value.trim(), channel: $('channel').value,
    interval_secs: Number($('interval').value) || 30,
    jitter_secs: Number($('jitter').value) || 0,
    daily_max: Number($('dailyMax').value) || 0,
    max_fail: Number($('maxFail').value) || 5,
  };
  try {
    const t = await api('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    toast('任务 #' + t.id + ' 已创建（' + t.status_text + '），发送 ' + receivers.length + ' 个目标');
    $('receivers').value = '';
    loadTasks();
  } catch (e) { toast('创建任务失败: ' + e.message); }
}
$('createTask').onclick = createTask;

const statusCls = { 0: 'st-0', 1: 'st-1', 2: 'st-2', 3: 'st-3', 4: 'st-4' };
function fmtTime(ms) {
  if (!ms) return '-';
  const d = new Date(ms);
  return d.toLocaleString('zh-CN', { hour12: false });
}

async function loadTasks() {
  try {
    const list = await api('/api/tasks?limit=30');
    const tb = $('taskBody');
    if (!list.length) { tb.innerHTML = '<tr><td colspan="9" class="muted">暂无任务</td></tr>'; return; }
    tb.innerHTML = list.map(t => `
      <tr>
        <td>#${t.id}</td>
        <td class="${statusCls[t.status] || ''}">${t.status_text}</td>
        <td>${t.channel || 'auto'}</td>
        <td>${t.total_count}</td>
        <td class="st-2">${t.success_count}</td>
        <td class="st-4">${t.fail_count}</td>
        <td class="err-text">${t.error || ''}</td>
        <td>${fmtTime(t.created_at)}</td>
        <td>${(t.status === 0 || t.status === 1) ? '<button class="danger" onclick="stopTask(' + t.id + ')">停止</button>' : ''}</td>
      </tr>`).join('');
  } catch (e) { /* 静默: 轮询失败不打扰 */ }
}

async function stopTask(id) {
  try {
    await api('/api/tasks/' + id + '/stop', { method: 'POST' });
    toast('任务 #' + id + ' 已停止');
    loadTasks();
  } catch (e) { toast('停止失败: ' + e.message); }
}

// ---------- init ----------
loadSettings();
loadAccounts();
loadTasks();
setInterval(loadTasks, 3000);
</script>
</body>
</html>
